
name: AgroMonitor CI

on:
  push:
    branches: [futuristic-ui]
  pull_request:
    branches: [futuristic-ui, main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: agromonitor_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agromonitor_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      POSTGRES_PASSWORD: test_password
      JWT_SECRET_KEY: ci-only-secret-key-not-for-production
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 60
      MQTT_CONSUMER_USERNAME: ci_test_consumer
      MQTT_CONSUMER_PASSWORD: ci_test_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run backend tests
        run: uv run python -m pytest tests --cov=app --cov-report=term-missing -v

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  deploy:
      name: Deploy to Render
      runs-on: ubuntu-latest

      needs: [backend-tests, frontend-build]

      if: github.event_name == 'push' && github.ref == 'refs/heads/futuristic-ui'

      steps:
        - name: Deploy Backend
          env:
            DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
          run: |
            curl --fail --show-error --silent \
              --request POST "$DEPLOY_HOOK"

        - name: Deploy Frontend
          env:
            DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
          run: |
            curl --fail --show-error --silent \
              --request POST "$DEPLOY_HOOK"
